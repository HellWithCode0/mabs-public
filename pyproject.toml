[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mabs"
version = "3.1.0a1"
description = "MABS v3: Sparse Local Escalation Matching (SLEM) for streaming QEC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leo Jordan" }]
dependencies = [
    "stim",
    "pymatching",
    "numpy",
    "pytest",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
mabs = "mabs.__main__:main"

[project.urls]
Homepage = "https://github.com/HellWithCode0/mabs"
Repository = "https://github.com/HellWithCode0/mabs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
