[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mabs"
version = "4.1.0a1"
description = "MABS v4.1: CASCADE priority list (CommitAction cache, pair LUT, peel/residual); 4.1.0a1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryaman Katoch" }]
dependencies = [
    "stim",
    "pymatching",
    "numpy",
    "pytest",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
mabs = "mabs.__main__:main"

[project.urls]
Homepage = "https://github.com/HellWithCode0/mabs-public"
Repository = "https://github.com/HellWithCode0/mabs-public"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
